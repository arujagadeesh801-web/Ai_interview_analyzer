<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Interview Analysis</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{

    min-height:100vh;
    background:
    radial-gradient(circle at top,#1e3a8a,transparent 40%),
    radial-gradient(circle at bottom,#7c3aed,transparent 40%),
    #050816;

    color:white;
    padding:25px;

}


.container{

    max-width:1100px;
    margin:auto;

}


.header{

    text-align:center;
    margin-bottom:35px;

}


.header h1{

    font-size:42px;
    background:linear-gradient(90deg,#38bdf8,#a78bfa);
    -webkit-background-clip:text;
    color:transparent;

}


.header p{

    color:#94a3b8;
    margin-top:10px;

}



.grid{

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:20px;

}



.card{

    background:rgba(15,23,42,0.8);

    border:1px solid rgba(148,163,184,.2);

    border-radius:22px;

    padding:25px;

    box-shadow:
    0 0 25px rgba(56,189,248,.1);

    transition:.3s;

}


.card:hover{

    transform:translateY(-8px);

    box-shadow:
    0 0 35px rgba(56,189,248,.3);

}



.icon{

    font-size:30px;

}


.value{

    font-size:35px;
    font-weight:700;
    margin-top:10px;

    color:#38bdf8;

}



.section{

    margin-top:25px;

    background:#0f172a;

    border-radius:22px;

    padding:25px;

    border:1px solid #1e293b;

}



.section h2{

    margin-bottom:15px;

    color:#a78bfa;

}



.content{

    background:#020617;

    padding:20px;

    border-radius:15px;

    line-height:1.8;

    color:#cbd5e1;

}



.score{

    margin-top:20px;

}



.bar{

    width:100%;
    height:14px;

    background:#1e293b;

    border-radius:20px;

    overflow:hidden;

}


.fill{

    height:100%;

    width:{{ percentage }}%;

    background:linear-gradient(90deg,#22c55e,#38bdf8);

}



.status{

    display:inline-block;

    margin-top:15px;

    padding:10px 25px;

    border-radius:30px;

    background:#22c55e;

    color:#001;

    font-weight:600;

}



button,a{

    display:inline-block;

    margin-top:30px;

    padding:15px 35px;

    border-radius:30px;

    text-decoration:none;

    background:linear-gradient(90deg,#38bdf8,#a78bfa);

    color:white;

    font-weight:600;

}



@media(max-width:600px){

.header h1{

font-size:30px;

}

}

</style>

</head>


<body>


<div class="container">


<div class="header">

<h1>🤖 AI Interview Coach</h1>

<p>Intelligent Performance Analysis Report</p>

</div>



<div class="grid">


<div class="card">

<div class="icon">🎯</div>

<p>Score</p>

<div class="value">{{ score }}/100</div>

</div>



<div class="card">

<div class="icon">📊</div>

<p>Average Score</p>

<div class="value">{{ average }}</div>

</div>



<div class="card">

<div class="icon">📈</div>

<p>Performance</p>

<div class="value">{{ percentage }}%</div>

</div>


</div>



<div class="section">

<h2>🏆 Result</h2>

<div class="status">

{{ result_status }}

</div>


<div class="score">

<div class="bar">

<div class="fill"></div>

</div>

</div>


</div>



<div class="section">

<h2>❓ Question</h2>

<div class="content">

{{ question }}

</div>

</div>




<div class="section">

<h2>✍ Your Answer</h2>

<div class="content">

{{ answer }}

</div>

</div>



<div class="section">

<h2>🤖 AI Feedback</h2>

<div class="content">

{{ feedback }}

</div>

</div>



<center>

<a href="/">

🔄 Start New Interview

</a>

</center>


</div>


</body>

</html>
