<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Interview Coach</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{

    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    overflow-x:hidden;
    background:#050816;
    color:white;

}

/* Animated Background */

body::before{

content:"";
position:fixed;
width:500px;
height:500px;
background:#00e5ff;
filter:blur(180px);
opacity:.18;
top:-120px;
left:-120px;
animation:moveOne 12s infinite alternate;

}

body::after{

content:"";
position:fixed;
width:450px;
height:450px;
background:#8b5cf6;
filter:blur(180px);
opacity:.18;
bottom:-120px;
right:-120px;
animation:moveTwo 14s infinite alternate;

}

@keyframes moveOne{

0%{
transform:translate(0,0);
}

100%{
transform:translate(120px,80px);
}

}

@keyframes moveTwo{

0%{
transform:translate(0,0);
}

100%{
transform:translate(-100px,-60px);
}

}

.container{

position:relative;
width:100%;
max-width:950px;
background:#101522;
border:1px solid rgba(0,229,255,.25);
border-radius:24px;
padding:35px;
box-shadow:

0 0 25px rgba(0,229,255,.20),
0 0 60px rgba(0,229,255,.10);

backdrop-filter:blur(12px);

z-index:10;

}

.logo{

font-size:55px;
text-align:center;
margin-bottom:10px;
animation:floatLogo 3s ease-in-out infinite;

}

@keyframes floatLogo{

0%,100%{
transform:translateY(0px);
}

50%{
transform:translateY(-8px);
}

}

.title{

font-size:38px;
font-weight:700;
text-align:center;
color:#00e5ff;
text-shadow:

0 0 12px #00e5ff,
0 0 28px #00e5ff;

}

.subtitle{

margin-top:8px;
text-align:center;
font-size:16px;
color:#b8c5d9;
margin-bottom:35px;

}

.question-card{

background:#161d2d;
border:1px solid rgba(0,229,255,.25);
border-radius:18px;
padding:25px;
margin-bottom:25px;
box-shadow:0 0 20px rgba(0,229,255,.12);

}

.question-card h3{

margin-bottom:18px;
font-size:22px;
color:#00e5ff;

}

.info-row{

display:flex;
flex-wrap:wrap;
gap:12px;
margin-bottom:20px;

}

.badge{

padding:8px 18px;
border-radius:50px;
background:rgba(0,229,255,.12);
border:1px solid rgba(0,229,255,.25);
color:#00e5ff;
font-size:14px;
font-weight:600;

}

.question-text{

font-size:19px;
line-height:1.8;
color:#f2f2f2;

}

label{

display:block;
margin-bottom:10px;
font-size:18px;
font-weight:600;

}

textarea{

width:100%;
height:220px;
padding:20px;
border-radius:18px;
border:1px solid rgba(0,229,255,.25);
background:#0e1523;
color:white;
font-size:16px;
resize:none;
outline:none;
transition:.3s;

}

textarea:focus{

border-color:#00e5ff;
box-shadow:

0 0 15px rgba(0,229,255,.35);

}

.button-group{

display:flex;
flex-wrap:wrap;
gap:15px;
margin-top:22px;

}

.btn{

flex:1;
padding:15px;
border:none;
border-radius:14px;
font-size:15px;
font-weight:600;
cursor:pointer;
transition:.3s;

}

.mic-btn{

background:#00c8ff;
color:black;
box-shadow:0 0 15px #00c8ff;

}

.stop-btn{

background:#ff9800;
color:white;
box-shadow:0 0 15px #ff9800;

}

.analyze-btn{

background:#00e676;
color:black;
box-shadow:0 0 15px #00e676;

}

.btn:hover{

transform:translateY(-3px) scale(1.03);

}

#status{

margin-top:20px;
font-weight:600;
text-align:center;

}

.success{

color:#00ff9d;

}

.error{

color:#ff6b6b;

}

.listening{

color:#ffd54f;

}

.wave{

display:inline-block;
animation:pulse 1s infinite;

}

@keyframes pulse{

0%{
transform:scale(1);
}

50%{
transform:scale(1.2);
}

100%{
transform:scale(1);
}

}

.footer{

margin-top:30px;
text-align:center;
color:#9db0cb;
font-size:14px;

}

@media(max-width:768px){

.container{

padding:20px;

}

.title{

font-size:30px;

}

.button-group{

flex-direction:column;

}

.btn{

width:100%;

}

}

</style>

</head>

<body>

<div class="container">

    <div class="logo">🤖</div>

    <h1 class="title">AI Interview Coach</h1>

    <p class="subtitle">
        Practice • Analyze • Improve • Get AI Feedback
    </p>

    <div class="question-card">

        <h3>📋 Interview Question</h3>

        <div class="info-row">

            <div class="badge">
                💼 {{ role }}
            </div>

            <div class="badge">
                🤖 AI Generated
            </div>

            <div class="badge">
                🚀 Professional Mode
            </div>

        </div>

        <div class="question-text">
            {{ question }}
        </div>

    </div>

    <form action="/analyze" method="POST">

        <input
            type="hidden"
            name="role"
            value="{{ role }}">

        <input
            type="hidden"
            name="question"
            value="{{ question }}">

        <label for="answer">
             Answer
        </label>

        <textarea
            id="answer"
            name="answer"
            placeholder="Type your answer here or click 'Start Speaking'..."
            required></textarea>

        <div class="button-group">

            <button
                type="button"
                class="btn mic-btn"
                onclick="startRecognition()">

                🎤 Start Speaking

            </button>

            <button
                type="button"
                class="btn stop-btn"
                onclick="stopRecognition()">

                🛑 Stop Recording

            </button>

            <button
                type="submit"
                class="btn analyze-btn">

                🚀 Analyze Answer

            </button>

        </div>

        <p id="status"></p>

    </form>

    <div class="footer">

    </div>

</div>

<script>

let recognition;
let isListening = false;

function startRecognition(){

    if(!('webkitSpeechRecognition' in window)){
        alert("Speech Recognition is not supported in this browser.");
        return;
    }

    recognition = new webkitSpeechRecognition();

    recognition.lang = "en-IN";
    recognition.continuous = true;
    recognition.interimResults = false;

    isListening = true;

    const status = document.getElementById("status");

    status.className = "listening";
    status.innerHTML =
    '<span class="wave">🎤</span> Listening... Speak now';

    recognition.start();

    recognition.onresult = function(event){

        let transcript = "";

        for(let i = event.resultIndex; i < event.results.length; i++){

            transcript += event.results[i][0].transcript + " ";

        }

        document.getElementById("answer").value += transcript;

        status.className = "success";
        status.innerHTML = "✅ Voice Captured Successfully";

    };

    recognition.onerror = function(event){

        status.className = "error";
        status.innerHTML = "❌ " + event.error;

    };

    recognition.onend = function(){

        if(isListening){

            status.className = "success";
            status.innerHTML = "✅ Recording Completed";

        }

    };

}

function stopRecognition(){

    if(recognition){

        isListening = false;

        recognition.stop();

        const status = document.getElementById("status");

        status.className = "success";
        status.innerHTML = "🛑 Recording Stopped";

    }

}

</script>

</body>

</html>
